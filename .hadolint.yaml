# hadolint policy for .devcontainer/Dockerfile, the only Dockerfile this repo
# owns. A devcontainer is a development box, not a deployment: it deliberately
# tracks current apt and npm packages (CONTRIBUTING.md, "Pinning policy"), so
# the version-pinning rules are off. Everything else fails CI's lint job at
# warning severity.
failure-threshold: warning
ignored:
  - DL3008  # apt-get install without pinned versions — deliberate for a devcontainer
  - DL3016  # npm install without pinned versions — same
  - DL3013  # pip install without pinned versions — same
  - DL3066  # non-numeric USER vscode — the user is defined by the base image
